      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceRangeResponse'
              examples:
                DailyPriceAggregation:
                  value:
                    country: AT
                    contract_type: A01
                    start_utc: '2026-03-01T00:00:00Z'
                    end_utc: '2026-03-03T00:00:00Z'
                    items:
                    - datetime_utc: '2026-03-01T00:00:00Z'
                      price: '83.250000'
                      currency: EUR
                      unit: MWH
                      resolution: P1D
                  summary: Daily price aggregation
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidRange:
                  value:
                    detail: Provide start & end (ISO UTC, e.g. 2025-09-18T00:00:00Z)
                      or use period=today|yesterday|dayahead.
                  summary: Invalid range
          description: The request parameters were missing, invalid, or internally
            inconsistent.
