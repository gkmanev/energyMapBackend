openapi: 3.0.3
info:
  title: visualize.energy Platform Data API
  version: 1.0.0
  description: REST API for visualize.energy - capacity, generation, price, and cross-border
    flow data. Use `/api/schema/` for the OpenAPI schema, `/api/docs/swagger/` to
    try endpoints, and `/api/docs/redoc/` for the reference documentation.
paths:
  /api/:
    get:
      operationId: root_retrieve
      description: Returns the main data endpoints together with links to the OpenAPI
        schema, Swagger UI, and ReDoc.
      summary: List API entrypoints
      tags:
      - Meta
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRootResponse'
              examples:
                APIRootResponse:
                  value:
                    auth_register: https://api.example.com/api/auth/register/
                    auth_login: https://api.example.com/api/auth/login/
                    auth_refresh: https://api.example.com/api/auth/refresh/
                    auth_me: https://api.example.com/api/auth/me/
                    capacity_latest: https://api.example.com/api/capacity/latest/
                    capacity_bulk_latest: https://api.example.com/api/capacity/bulk-latest/
                    generation_yesterday: https://api.example.com/api/generation/yesterday/
                    chart_query: https://api.example.com/api/chart-query/
                    prices_range: https://api.example.com/api/prices/range/
                    price_bulk: https://api.example.com/api/prices/bulk-range/
                    generation_range: https://api.example.com/api/generation/range/
                    generation_res_range: https://api.example.com/api/generation-res/range/
                    generation_bulk_range: https://api.example.com/api/generation/bulk-range/
                    generation_forecast_range: https://api.example.com/api/generation-forecast/range/
                    generation_irradiance_range: https://api.example.com/api/generation-irradiance/range/
                    generation_irradiance_bulk_range: https://api.example.com/api/generation-irradiance/bulk-range/
                    generation_wind_speed_range: https://api.example.com/api/generation-wind-speed/range/
                    generation_wind_speed_bulk_range: https://api.example.com/api/generation-wind-speed/bulk-range/
                    flows_range: https://api.example.com/api/flows/range/
                    flows_country_range: https://api.example.com/api/flows/country-range/
                    flows_latest: https://api.example.com/api/flows/latest/
                    schema: https://api.example.com/api/schema/
                    swagger_ui: https://api.example.com/api/docs/swagger/
                    redoc: https://api.example.com/api/docs/redoc/
                  summary: API root response
          description: ''
  /api/auth/activate/{uidb64}/{token}/:
    get:
      operationId: auth_activate_retrieve
      description: Activate an account from the one-time URL sent by email.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      - in: path
        name: uidb64
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticates a user and returns a JWT access/refresh token pair.
      summary: Log in with email and password
      tags:
      - Meta
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              LoginRequest:
                value:
                  email: user@example.com
                  password: StrongPassword123!
                summary: Login request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request parameters were missing, invalid, or internally
            inconsistent.
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Requires a Bearer access token.
      summary: Return the current authenticated user
      tags:
      - Meta
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request parameters were missing, invalid, or internally
            inconsistent.
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Accepts a refresh token and returns a new access token.
      summary: Refresh an access token
      tags:
      - Meta
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request parameters were missing, invalid, or internally
            inconsistent.
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Creates an inactive user and sends a one-time activation link by
        email.
      summary: Register a user account
      tags:
      - Meta
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              RegisterRequest:
                value:
                  email: user@example.com
                  password: StrongPassword123!
                  first_name: Ada
                  last_name: Lovelace
                summary: Register request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationPendingResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request parameters were missing, invalid, or internally
            inconsistent.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request parameters were missing, invalid, or internally
            inconsistent.
  /api/capacity/bulk-latest/:
    get:
      operationId: capacity_bulk_latest_retrieve
      description: Returns the latest installed-capacity snapshot for each requested
        country. The `data` object is keyed by country code.
      summary: Latest capacity snapshot for multiple countries
      parameters:
      - in: query
        name: countries
        schema:
          type: string
        description: Comma-separated ISO country codes such as `BG,RO,GR`. Maximum
          40 countries per request.
        required: true
      - in: query
        name: psr
        schema:
          type: string
        description: ENTSO-E production type code such as `B16` (solar) or `B18` (wind).
      tags:
      - Capacity
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityBulkResponse'
              examples:
                BulkCapacitySnapshot:
                  value:
                    request_info:
                      countries_requested:
                      - BG
                      - RO
                      - XX
                      countries_found:
                      - BG
                      - RO
                      countries_ignored:
                      - XX
                      psr: B16
                      total_countries: 2
                      total_records: 2
                      server_elapsed_ms: 8.47
                    data:
                      BG:
                        country: BG
                        year: 2025
                        items:
                        - psr_type: B16
                          psr_name: Solar
                          installed_capacity_mw: '3021.000'
                      RO:
                        country: RO
                        year: 2025
                        items:
                        - psr_type: B16
                          psr_name: Solar
                          installed_capacity_mw: '1885.400'
                  summary: Bulk capacity snapshot
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MissingCountriesParameter:
                  value:
                    detail: countries parameter is required
                  summary: Missing countries parameter
          description: The request parameters were missing, invalid, or internally
            inconsistent.
  /api/capacity/latest/:
    get:
      operationId: capacity_latest_retrieve
      description: Returns the most recent installed-capacity snapshot available for
        a single country, optionally filtered by ENTSO-E production type.
      summary: Latest capacity snapshot for one country
      parameters:
      - in: query
        name: country
        schema:
          type: string
        description: Two-letter ISO country code, for example `BG` or `DE`.
        required: true
      - in: query
        name: psr
        schema:
          type: string
        description: ENTSO-E production type code such as `B16` (solar) or `B18` (wind).
      tags:
      - Capacity
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityLatestResponse'
              examples:
                CapacitySnapshot:
                  value:
                    country: BG
                    year: 2025
                    items:
                    - psr_type: B16
                      psr_name: Solar
                      installed_capacity_mw: '3021.000'
                    - psr_type: B18
                      psr_name: Wind Offshore
                      installed_capacity_mw: '245.500'
                  summary: Capacity snapshot
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidCountry:
                  value:
                    detail: Unknown country 'XX'. Make sure it's loaded in the DB.
                  summary: Invalid country
          description: The request parameters were missing, invalid, or internally
            inconsistent.
  /api/chart-query/:
    post:
      operationId: chart_query_create
      description: Accepts a natural-language message, runs the multi-step energy
        agent, and returns either plain text or one or more chart specs.
      summary: Chat with the energy agent
      tags:
      - Meta
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChartQueryRequest'
            examples:
              ChatRequest:
                value:
                  message: Compare RES generation for BG and RO for April. Daily resolution
                summary: Chat request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChartQueryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChartQueryRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartQueryResponse'
              examples:
                ChartResponse:
                  value:
                    conversation_id: 7d4d9300-4a6f-44be-b59f-7c648cc44062
                    status: chart
                    text: Showing RES generation for BG and RO for April as a line
                      chart.
                    charts:
                    - title: BG vs RO renewable generation
                      data_type: generation_res
                      countries:
                      - BG
                      - RO
                      series:
                      - res
                      include_prices: false
                      start_utc: '2026-04-01T00:00:00Z'
                      end_utc: '2026-04-30T00:00:00Z'
                      resolution: d
                      chart_type: line
                  summary: Chart response
                TextResponse:
                  value:
                    conversation_id: 7d4d9300-4a6f-44be-b59f-7c648cc44062
                    status: text
                    text: Which country and what time range should I use?
                    charts: []
                  summary: Text response
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request parameters were missing, invalid, or internally
            inconsistent.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request parameters were missing, invalid, or internally
            inconsistent.
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request parameters were missing, invalid, or internally
            inconsistent.
  /api/chat/:
    post:
      operationId: chat_create
      description: Accepts a natural-language message, runs the multi-step energy
        agent, and returns either plain text or one or more chart specs.
      summary: Chat with the energy agent
      tags:
      - Meta
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChartQueryRequest'
            examples:
              ChatRequest:
                value:
                  message: Compare RES generation for BG and RO for April. Daily resolution
                summary: Chat request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChartQueryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChartQueryRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartQueryResponse'
              examples:
                ChartResponse:
                  value:
                    conversation_id: 7d4d9300-4a6f-44be-b59f-7c648cc44062
                    status: chart
                    text: Showing RES generation for BG and RO for April as a line
                      chart.
                    charts:
                    - title: BG vs RO renewable generation
                      data_type: generation_res
                      countries:
                      - BG
                      - RO
                      series:
                      - res
                      include_prices: false
                      start_utc: '2026-04-01T00:00:00Z'
                      end_utc: '2026-04-30T00:00:00Z'
                      resolution: d
                      chart_type: line
                  summary: Chart response
                TextResponse:
                  value:
                    conversation_id: 7d4d9300-4a6f-44be-b59f-7c648cc44062
                    status: text
                    text: Which country and what time range should I use?
                    charts: []
                  summary: Text response
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request parameters were missing, invalid, or internally
            inconsistent.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request parameters were missing, invalid, or internally
            inconsistent.
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request parameters were missing, invalid, or internally
            inconsistent.
  /api/flows/country-range/:
    get:
      operationId: flows_country_range_retrieve
      description: Returns UTC buckets of physical flows in MW. Each directed EIC
        border is averaged over its observed interval duration, then border averages
        are summed. Positive net_mw means net imports (imports minus exports). Source
        timestamps are interval starts. Ranges are start-inclusive and end-exclusive;
        explicit boundaries retain minute precision. Buckets align to UTC clock boundaries.
        Empty buckets are omitted, rather than filled with zero. is_partial flags
        missing coverage among borders observed in the requested window; entirely
        missing borders cannot be detected. Partial values average available observations
        only. Missing source resolution uses the ingestion default PT15M. Source intervals
        up to one day are supported. period=today stops at the latest completed UTC
        quarter hour.
      summary: Country import, export and net flow time series
      parameters:
      - in: query
        name: country
        schema:
          type: string
        description: Two-letter ISO country code, for example `BG` or `DE`.
        required: true
      - in: query
        name: end
        schema:
          type: string
          format: date-time
        description: Exclusive range end in ISO-8601 UTC unless noted otherwise, for
          example `2026-03-02T00:00:00Z`.
      - in: query
        name: period
        schema:
          type: string
          enum:
          - today
          - yesterday
        description: 'Shortcut for a predefined UTC window. Supported values: `today|yesterday`.'
      - in: query
        name: resolution
        schema:
          type: string
          enum:
          - 15m
          - d
          - h
        description: UTC bucket size; defaults to h (hourly).
      - in: query
        name: start
        schema:
          type: string
          format: date-time
        description: Inclusive range start in ISO-8601 UTC, for example `2026-03-01T00:00:00Z`.
      tags:
      - Flows
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryFlowsRangeResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request parameters were missing, invalid, or internally
            inconsistent.
  /api/flows/latest/:
    get:
      operationId: flows_latest_retrieve
      description: Returns the latest available hourly flow window touching the requested
        country, plus inbound/outbound totals and optional neighbor breakdowns.
      summary: Latest physical flow window for one country
      parameters:
      - in: query
        name: country
        schema:
          type: string
        description: Two-letter ISO country code, for example `BG` or `DE`.
        required: true
      - in: query
        name: neighbors
        schema:
          type: boolean
        description: When `true`, include inbound, outbound, and net totals grouped
          by neighboring country.
      tags:
      - Flows
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalFlowsLatestResponse'
              examples:
                LatestFlowResponse:
                  value:
                    country: BG
                    start_utc: '2026-03-10T09:00:00Z'
                    end_utc: '2026-03-10T10:00:00Z'
                    count: 2
                    items:
                    - datetime_utc: '2026-03-10T09:00:00Z'
                      country_from: BG
                      country_to: RO
                      out_domain_eic: 10YCA-BULGARIA-R
                      in_domain_eic: 10YRO-TEL------P
                      resolution: PT60M
                      quantity_mw: 320.0
                      created_at: '2026-03-10T09:03:00Z'
                    totals:
                      in_mw: 180.0
                      out_mw: 320.0
                      net_mw: -140.0
                    neighbors:
                    - neighbor: RO
                      in_mw: 180.0
                      out_mw: 320.0
                      net_mw: -140.0
                  summary: Latest flow response
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidCountry:
                  value:
                    detail: Unknown country 'XX'. Make sure it's loaded in the DB.
                  summary: Invalid country
          description: The request parameters were missing, invalid, or internally
            inconsistent.
  /api/flows/range/:
    get:
      operationId: flows_range_retrieve
      description: Returns cross-border physical flows for a period or explicit UTC
        window. Results can be filtered by source country, destination country, or
        a country set.
      summary: Physical flow range
      parameters:
      - in: query
        name: countries
        schema:
          type: string
        description: Comma-separated ISO country codes such as `BG,RO,GR`.
      - in: query
        name: end
        schema:
          type: string
          format: date-time
        description: Exclusive range end in ISO-8601 UTC unless noted otherwise, for
          example `2026-03-02T00:00:00Z`.
      - in: query
        name: from
        schema:
          type: string
        description: Filter by source country ISO code.
      - in: query
        name: period
        schema:
          type: string
          enum:
          - today
          - yesterday
        description: 'Shortcut for a predefined UTC window. Supported values: `today|yesterday`.'
      - in: query
        name: start
        schema:
          type: string
          format: date-time
        description: Inclusive range start in ISO-8601 UTC, for example `2026-03-01T00:00:00Z`.
      - in: query
        name: to
        schema:
          type: string
        description: Filter by destination country ISO code.
      tags:
      - Flows
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalFlowsRangeResponse'
              examples:
                FlowRangeResponse:
                  value:
                    start_utc: '2026-03-10T00:00:00Z'
                    end_utc: '2026-03-10T03:00:00Z'
                    count: 2
                    items:
                    - datetime_utc: '2026-03-10T01:00:00Z'
                      country_from: BG
                      country_to: RO
                      out_domain_eic: 10YCA-BULGARIA-R
                      in_domain_eic: 10YRO-TEL------P
                      resolution: PT60M
                      quantity_mw: 421.5
                      created_at: '2026-03-10T01:05:00Z'
                  summary: Flow range response
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidRange:
                  value:
                    detail: Provide start & end (ISO UTC, e.g. 2025-09-18T00:00:00Z)
                      or use period=today|yesterday|dayahead.
                  summary: Invalid range
          description: The request parameters were missing, invalid, or internally
            inconsistent.
  /api/generation-forecast/range/:
    get:
      operationId: generation_forecast_range_retrieve
      description: Returns forecast generation by production type for a country, using
        shortcut periods or an explicit UTC range.
      summary: Generation forecast range for one country
      parameters:
      - in: query
        name: country
        schema:
          type: string
        description: Two-letter ISO country code, for example `BG` or `DE`.
        required: true
      - in: query
        name: end
        schema:
          type: string
          format: date-time
        description: Exclusive range end in ISO-8601 UTC unless noted otherwise, for
          example `2026-03-02T00:00:00Z`.
      - in: query
        name: period
        schema:
          type: string
          enum:
          - today
          - yesterday
        description: 'Shortcut for a predefined UTC window. Supported values: `today|yesterday`.'
      - in: query
        name: psr
        schema:
          type: string
        description: ENTSO-E production type code such as `B16` (solar) or `B18` (wind).
      - in: query
        name: start
        schema:
          type: string
          format: date-time
        description: Inclusive range start in ISO-8601 UTC, for example `2026-03-01T00:00:00Z`.
      tags:
      - Generation
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationForecastResponse'
              examples:
                GenerationForecastResponse:
                  value:
                    country: CZ
                    date_label: today (UTC)
                    start_utc: '2026-03-10T00:00:00Z'
                    end_utc: '2026-03-11T00:00:00Z'
                    items:
                    - country: CZ
                      datetime_utc: '2026-03-10T10:00:00Z'
                      psr_type: B16
                      psr_name: Solar
                      forecast_mw: '920.440'
                      resolution: PT60M
                  summary: Generation forecast response
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidRange:
                  value:
                    detail: Provide start & end (ISO UTC, e.g. 2025-09-18T00:00:00Z)
                      or use period=today|yesterday|dayahead.
                  summary: Invalid range
          description: The request parameters were missing, invalid, or internally
            inconsistent.
  /api/generation-irradiance/bulk-range/:
    get:
      operationId: generation_irradiance_bulk_range_retrieve
      description: Returns hourly Open-Meteo global tilted irradiance points for multiple
        countries. Use `countries=ALL` or omit the parameter to include all configured
        countries from `COUNTRY_COORDS`. Geometry filters are optional; if omitted,
        all stored tilt and azimuth combinations are returned.
      summary: Global tilted irradiance range for multiple countries
      parameters:
      - in: query
        name: azimuth
        schema:
          type: number
        description: Optional panel azimuth filter in degrees. Omit to return all
          stored azimuth values.
      - in: query
        name: countries
        schema:
          type: string
        description: Comma-separated ISO country codes such as `BG,RO,GR`. Maximum
          60 countries per request.
      - in: query
        name: end
        schema:
          type: string
          format: date-time
        description: Exclusive range end in ISO-8601 UTC unless noted otherwise, for
          example `2026-03-02T00:00:00Z`.
      - in: query
        name: period
        schema:
          type: string
          enum:
          - today
